# --- Identidad del plugin ---------------------------------------------------
pluginGroup = dev.everts.adbwifi
pluginName = ADB Wi-Fi Pairing
# TODO: reemplazar por la URL real del repositorio cuando exista.
pluginRepositoryUrl = https://github.com/OWNER/myadbwifi
# SemVer. El CHANGELOG.md debe tener una sección para cada versión publicada.
pluginVersion = 0.1.3

# --- Plataforma objetivo ----------------------------------------------------
# Android Studio Rabbit 2026.2.1 (build AI-262.9437.185). Lista de versiones:
# https://plugins.jetbrains.com/docs/intellij/android-studio-releases-list.html
platformVersion = 2026.2.1.8
# De momento solo la versión instalada (2026.2.1). Para ampliar el rango, verificar antes con verifyPlugin.
pluginSinceBuild = 262
pluginUntilBuild = 262.*

# Para desarrollo local se puede usar una instalación existente de Android Studio
# en lugar de descargarla. Defínelo en local.properties (no se versiona):
#   platform.localPath=/Applications/Android Studio.app

# --- Gradle -----------------------------------------------------------------
# El stdlib de Kotlin lo provee la IDE -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
