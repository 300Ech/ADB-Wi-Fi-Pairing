# Bonjour discovery
diagnostic.ADB_DISCOVERY_BLIND.title=adb does not see {0,choice,1#1 device|1<{0} devices} that macOS sees
diagnostic.ADB_DISCOVERY_BLIND.detail=adb’s own mDNS discovery does not see devices that Bonjour (macOS) does see. Usually the adb server lost access to the local network: on macOS it inherits the Local Network permission of the app that started it, and then it cannot connect either (“No route to host”). This plugin also uses Bonjour and restarts adb when it needs to, but Android Studio’s own “Pair devices using Wi-Fi” dialog will not find them until adb is restarted.
failure.ADB_SERVER_NO_NETWORK=Android Studio reaches the phone but the adb server cannot ("No route to host"), even after restarting it. On macOS the adb server inherits the Local Network permission of the app that started it: quit every app that uses adb (terminals, other IDEs), restart adb from here, and check System Settings > Privacy and Security > Local Network.

# macOS Local Network permission handled by the plugin
hint.offNetwork={0} is not on this computer\u2019s network ({1}). If the phone has a VPN on (key icon in the status bar), Android shows the VPN address: turn the VPN off and use the address the phone shows then.
diagnostic.STUDIO_NO_LOCAL_NETWORK.title=macOS does not let Android Studio use the local network
diagnostic.STUDIO_NO_LOCAL_NETWORK.detail=Android Studio does not have the Local Network permission, and adb inherits it from Android Studio, so nothing can find or reach phones over Wi-Fi (Android Studio\u2019s own pairing dialog neither). Turn on Android Studio in System Settings > Privacy and Security > Local Network. The plugin restarts adb by itself as soon as the permission is on; if it is already on, restart Android Studio.
banner.localNetwork.text=Wi-Fi debugging needs one macOS permission: turn on Android Studio in System Settings > Privacy and Security > Local Network. Until then no tool in Android Studio can find or reach phones over Wi-Fi. If it is already on, restart Android Studio.
banner.localNetwork.open=Open Local Network Settings
banner.localNetwork.check=Check Again
banner.restart.text=Local Network permission is on. Restart Android Studio to apply it to adb: macOS gives it to the tools Android Studio starts only after a restart.
banner.restart.action=Restart Android Studio
diagnostic.STUDIO_RESTART_REQUIRED.title=Restart Android Studio to finish enabling Wi-Fi debugging
diagnostic.STUDIO_RESTART_REQUIRED.detail=Android Studio already has the Local Network permission, but adb still cannot reach the network: macOS applies the permission to the tools Android Studio starts only after Android Studio restarts.
diagnostic.fix.RESTART_STUDIO=Restart Android Studio
