failure.PAIRING_CLIENT_FAILED=adb no pudo iniciar el emparejamiento. Reinicia el servidor adb y vuelve a intentarlo.
failure.AUTHENTICATION_FAILED=El teléfono rechazó la clave de este ordenador: ya no está emparejado (se revocaron o caducaron las autorizaciones). Vuelve a emparejarlo.
failure.NO_WIFI_ADDRESS=El dispositivo no tiene IP de Wi-Fi. Conéctalo a la misma red Wi-Fi que este ordenador.
failure.UNKNOWN=adb no pudo completar la operación.
problem.adbNotFound=No se encontró adb. Instala Android SDK Platform-Tools desde el SDK Manager o define ANDROID_HOME.
problem.adbFailed=adb falló: {0}

