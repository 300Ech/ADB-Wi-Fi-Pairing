diagnostic.ADB_FAILED.detail={0}. Reiniciar el servidor adb suele arreglarlo.
diagnostic.ADB_TOO_OLD.title=adb {0} es demasiado antiguo
diagnostic.ADB_TOO_OLD.detail=El emparejamiento inalámbrico necesita platform-tools 30 o posterior. Actualízalas en el SDK Manager.
diagnostic.MDNS_OK.title=Descubrimiento mDNS activo ({0})
diagnostic.MDNS_OK.detail=adb puede encontrar dispositivos que anuncian depuración inalámbrica en esta red.
diagnostic.MDNS_UNAVAILABLE.title=Descubrimiento mDNS desactivado
diagnostic.MDNS_UNAVAILABLE.detail=adb dice: {0}. Los dispositivos no aparecerán solos ni se reconectarán automáticamente; emparejar con dirección IP y puerto sigue funcionando. Si tienes ADB_MDNS=0 en tu entorno, quítalo o reinicia adb con el descubrimiento activado.
diagnostic.MDNS_NOTHING_ANNOUNCED.title=Ningún dispositivo anuncia depuración inalámbrica
diagnostic.MDNS_NOTHING_ANNOUNCED.detail=Activa Depuración inalámbrica en el teléfono. Si ya está activa y no aparece nada, puede que esta Wi-Fi bloquee multicast (las redes de invitados y corporativas suelen hacerlo): empareja con dirección IP y puerto.
diagnostic.MDNS_ANNOUNCING.title={0,choice,1#1 servicio de depuración inalámbrica visible|1<{0} servicios de depuración inalámbrica visibles}
diagnostic.MDNS_ANNOUNCING.detail=El descubrimiento funciona en esta red.
diagnostic.WIRELESS_DEBUGGING_OFF.title=No anuncian: {0}
diagnostic.WIRELESS_DEBUGGING_OFF.detail=Android desactiva la depuración inalámbrica cuando el teléfono cambia de red, se reinicia o tras un tiempo. Vuelve a activarla en Opciones de desarrollador.
diagnostic.CERTIFICATE_REJECTED.title={0} rechaza este ordenador
diagnostic.CERTIFICATE_REJECTED.detail=El teléfono está en la red pero rechaza la clave adb de este ordenador, así que nunca conecta (adb lo reintenta en segundo plano). La autorización se revocó en el teléfono o caducó: Android olvida los ordenadores sin usar durante 7 días salvo que esté activado “Inhabilitar tiempo de espera de autorización de adb” en Opciones de desarrollador. Vuelve a emparejarlo.
diagnostic.NO_TARGET.title=Comprobaciones de red omitidas
diagnostic.NO_TARGET.detail=Escribe arriba la dirección IP y el puerto del teléfono para comprobar si este ordenador llega a él.
diagnostic.NO_LOCAL_NETWORK.title=Este ordenador no tiene red IPv4
diagnostic.NO_LOCAL_NETWORK.detail=Conéctate a la misma red Wi-Fi que el teléfono.
diagnostic.SAME_SUBNET.title={0} está en tu red
diagnostic.SAME_SUBNET.detail=Misma subred que {1}.
diagnostic.DIFFERENT_SUBNET.title={0} no está en tu red
diagnostic.DIFFERENT_SUBNET.detail=Tus redes: {1}. Conéctate a la Wi-Fi del teléfono o revisa la dirección. Las redes de invitados, los repetidores mesh y las VPN pueden separar los dispositivos.
diagnostic.VPN_ACTIVE.title=Hay una VPN o túnel activo ({0})
diagnostic.VPN_ACTIVE.detail=Algunas VPN desvían o bloquean el tráfico local. Si las conexiones fallan, prueba con la VPN desactivada.
diagnostic.PORT_OPEN.title={0} acepta conexiones
diagnostic.PORT_OPEN.detail=El teléfono es accesible. Si emparejar o conectar sigue fallando, revisa el código y que el puerto sea el que se muestra ahora.
diagnostic.PORT_REFUSED.title={0} rechaza conexiones
diagnostic.PORT_REFUSED.detail=El teléfono es accesible pero nadie escucha en ese puerto: la depuración inalámbrica está desactivada o el puerto cambió (cambia en cada sesión). Usa el puerto que muestra ahora el teléfono.
diagnostic.PORT_TIMEOUT.title={0} no responde
diagnostic.PORT_TIMEOUT.detail=La conexión agotó el tiempo. El teléfono puede estar en reposo o en otra red, o la Wi-Fi aísla a los clientes entre sí (habitual en redes de invitados).
diagnostic.HOST_DOWN.title=Ningún dispositivo responde en {0}
diagnostic.HOST_DOWN.detail=Revisa la dirección IP y que el teléfono esté despierto y en la misma Wi-Fi.
diagnostic.LOCAL_NETWORK_BLOCKED.title=macOS impide a Android Studio usar la red local
diagnostic.LOCAL_NETWORK_BLOCKED.detail={0} está en tu subred pero la conexión falla con “No route to host”: Android Studio no tiene el permiso Red local. Actívalo en Ajustes del Sistema > Privacidad y seguridad > Red local y reinicia Android Studio. macOS puede restablecer este permiso tras actualizarse.
