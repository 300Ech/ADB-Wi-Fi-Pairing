# Descubrimiento por Bonjour
diagnostic.ADB_DISCOVERY_BLIND.title=adb no ve {0,choice,1#1 dispositivo|1<{0} dispositivos} que macOS sí ve
diagnostic.ADB_DISCOVERY_BLIND.detail=El descubrimiento mDNS propio de adb no ve dispositivos que Bonjour (macOS) sí ve. Suele ser que el servidor adb perdió el acceso a la red local: en macOS hereda el permiso Red local de la app que lo arrancó, y entonces tampoco puede conectar (“No route to host”). Este plugin usa también Bonjour y reinicia adb cuando hace falta, pero el diálogo de Android Studio “Pair devices using Wi-Fi” no los encontrará hasta reiniciar adb.
failure.ADB_SERVER_NO_NETWORK=Android Studio llega al teléfono pero el servidor adb no ("No route to host"), incluso tras reiniciarlo. En macOS el servidor adb hereda el permiso Red local de la app que lo arrancó: cierra las apps que usen adb (terminales, otros IDEs), reinicia adb desde aquí y revisa Ajustes del Sistema > Privacidad y seguridad > Red local.

# Permiso Red local de macOS resuelto por el plugin
hint.offNetwork={0} no está en la red de este ordenador ({1}). Si el teléfono tiene una VPN activada (icono de llave en la barra de estado), Android muestra la dirección de la VPN: desactívala y usa la dirección que muestre entonces.
diagnostic.STUDIO_NO_LOCAL_NETWORK.title=macOS no deja a Android Studio usar la red local
diagnostic.STUDIO_NO_LOCAL_NETWORK.detail=Android Studio no tiene el permiso Red local, y adb lo hereda de Android Studio, así que nada puede encontrar ni alcanzar teléfonos por Wi-Fi (tampoco el diálogo de emparejamiento de Android Studio). Activa Android Studio en Ajustes del Sistema > Privacidad y seguridad > Red local. El plugin reinicia adb solo en cuanto el permiso está activo; si ya lo estaba, reinicia Android Studio.
banner.localNetwork.text=La depuración por Wi-Fi necesita un permiso de macOS: activa Android Studio en Ajustes del Sistema > Privacidad y seguridad > Red local. Hasta entonces ninguna herramienta de Android Studio puede encontrar ni alcanzar teléfonos por Wi-Fi. Si ya está activado, reinicia Android Studio.
banner.localNetwork.open=Abrir ajustes de Red local
banner.localNetwork.check=Comprobar de nuevo
banner.restart.text=El permiso Red local ya está activo. Reinicia Android Studio para que llegue a adb: macOS se lo da a las herramientas que lanza Android Studio solo después de reiniciarlo.
banner.restart.action=Reiniciar Android Studio
diagnostic.STUDIO_RESTART_REQUIRED.title=Reinicia Android Studio para terminar de activar la depuración por Wi-Fi
diagnostic.STUDIO_RESTART_REQUIRED.detail=Android Studio ya tiene el permiso Red local, pero adb todavía no llega a la red: macOS aplica el permiso a las herramientas que lanza Android Studio solo cuando este se reinicia.
diagnostic.fix.RESTART_STUDIO=Reiniciar Android Studio
