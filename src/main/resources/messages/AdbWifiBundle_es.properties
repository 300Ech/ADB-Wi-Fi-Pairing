failure.withAdbMessage={0}<br><br>adb dijo: <code>{1}</code>
failure.CONNECTION_REFUSED=Nadie escucha en ese puerto. Comprueba que la depuración inalámbrica está activada y usa el puerto que muestra ahora el teléfono; cambia en cada sesión.
failure.NO_ROUTE_TO_HOST=Este ordenador no llega al teléfono. En macOS, permite Android Studio en Ajustes del Sistema > Privacidad y seguridad > Red local; si no, comprueba que ambos estén en la misma red.
